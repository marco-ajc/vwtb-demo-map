<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>body{margin:0}#map{height:100vh;width:100%}</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var data = JSON.parse(decodeURIComponent(params.get('data') || '[]'));
    var map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);

    var markers = [];
    data.forEach(function(r) {
      var m = L.marker([r.lat, r.lng]).addTo(map);
      m.bindPopup(
        '<strong>' + r.vin + '</strong><br/>' +
        'Cliente: ' + r.customer + '<br/>' +
        'Km: ' + r.mileage.toLocaleString('es-MX') + '<br/>' +
        'Combustible: ' + r.fuel + '%<br/>' +
        'Horas: ' + r.engineHours.toLocaleString('es-MX') + '<br/>' +
        'Falla: ' + r.faultCode
      );
      markers.push(m);
    });

    // Zoom to fit all markers
    if (markers.length > 0) {
      var group = L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.3));
    } else {
      map.setView([20, -100], 4);
    }

    // Open popup on first marker if only one
    if (markers.length === 1) {
      markers[0].openPopup();
    }
  </script>
</body>
</html>

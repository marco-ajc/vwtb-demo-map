<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>body{margin:0}#map{height:100vh;width:100%}</style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var data = JSON.parse(decodeURIComponent(params.get('data') || '[]'));
    var map = L.map('map').setView([20,-100], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
    data.forEach(function(r) {
      L.marker([r.lat, r.lng]).addTo(map).bindPopup(
        '<strong>' + r.vin + '</strong><br/>' +
        'Cliente: ' + r.customer + '<br/>' +
        'Km: ' + r.mileage.toLocaleString('es-MX') + '<br/>' +
        'Combustible: ' + r.fuel + '%<br/>' +
        'Horas: ' + r.engineHours.toLocaleString('es-MX') + '<br/>' +
        'Falla: ' + r.faultCode
      );
    });
  </script>
</body>
</html>
